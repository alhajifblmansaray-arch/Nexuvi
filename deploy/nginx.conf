user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 20M;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1000;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

  log_format main '$remote_addr - $host "$request" $status $body_bytes_sent "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # The three application processes share one container, so they differ only by port.
  upstream staff   { server app:3000; }
  upstream portal  { server app:3002; }

  # `Connection: upgrade` belongs only on requests that actually asked for an upgrade.
  # Sending it on ordinary requests breaks keepalive to the upstream.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Everything a backend needs to reconstruct the original request. `Host` is passed through
  # unchanged and is load-bearing: the Next server reads it and forwards it to the API as
  # `X-Forwarded-Host`, which is how an anonymous request finds its clinic's branding.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;
  proxy_http_version 1.1;

  # Unrecognised hostnames are dropped without a response rather than served a default site.
  # Anything reaching here is a scanner walking IP ranges, and answering it only confirms
  # something is listening.
  server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    return 444;
  }

  server {
    listen 80;
    server_name .nexuvi.health;
    return 301 https://$host$request_uri;
  }

  # --- Platform surfaces -----------------------------------------------------------------
  # Exact names, so they win over both regexes below regardless of ordering.
  server {
    listen 443 ssl;
    server_name nexuvi.health www.nexuvi.health app.nexuvi.health;

    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / { proxy_pass http://staff; }
  }

  # --- Staff workspace: {slug}-app.nexuvi.health -----------------------------------------
  # A regex rather than a wildcard: nginx wildcards only match a whole leftmost label, and
  # `*-app.nexuvi.health` is not a form it accepts. This must be declared BEFORE the portal
  # block — regexes are tried in source order, and the portal pattern would also match
  # `clinic-app`, sending staff to the patient portal.
  server {
    listen 443 ssl;
    server_name ~^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?-app\.nexuvi\.health$;

    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / { proxy_pass http://staff; }
  }

  # --- Patient portal: {slug}.nexuvi.health ----------------------------------------------
  server {
    listen 443 ssl;
    server_name ~^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.nexuvi\.health$;

    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / { proxy_pass http://portal; }
  }
}
